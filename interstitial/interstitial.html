<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gatekey — Seleccionar contenedor</title>
  <link rel="stylesheet" href="interstitial.css" />
</head>
<body>
  <div id="cg-overlay">
    <main id="cg-modal" aria-labelledby="cg-title">
      <header class="cg-header">
        <div class="cg-title-block">
          <p class="cg-wordmark">Gatekey</p>
          <h1 class="cg-title" id="cg-title" data-i18n="interstitialQuestion">
            ¿En qué contenedor quieres abrir este enlace?
          </h1>
        </div>
        <button class="cg-close" id="cg-close" type="button" data-i18n-aria-label="cancel" aria-label="Cancelar">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" />
          </svg>
        </button>
      </header>

      <section class="cg-url-block" aria-label="URL">
        <span class="cg-domain" id="cg-domain"></span>
        <span class="cg-url-full" id="cg-url-full"></span>
      </section>

      <div class="cg-picker-heading">
        <h2 class="cg-containers-label" data-i18n="containersAvailable">Contenedores disponibles</h2>
        <p class="cg-keyboard-hint" data-i18n="keyboardHint">1–9 elegir contenedor · 0 sin contenedor · Esc cancelar</p>
      </div>
      <div class="cg-container-grid" id="cg-grid"></div>

      <footer class="cg-footer">
        <label class="cg-remember-label">
          <input type="checkbox" id="cg-remember" />
          <span><span data-i18n="rememberFor">Recordar para</span> <strong id="cg-remember-domain"></strong></span>
        </label>
        <button class="cg-btn cg-btn-normal" id="cg-open-normal" type="button" data-i18n="openWithoutContainer">
          Abrir sin contenedor
        </button>
      </footer>
    </main>
  </div>

  <script src="../i18n.js"></script>
  <script src="../order.js"></script>
  <script src="interstitial.js"></script>
</body>
</html>
