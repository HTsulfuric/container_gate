<!doctype html>
<html lang="es" data-i18n-doctitle="extName">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title></title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <header class="header">
            <div>
                <h1 class="title" data-i18n="extName"></h1>
                <p class="subtitle" data-i18n="subtitle"></p>
            </div>
        </header>

        <nav class="tabs" role="tablist" data-i18n-aria-label="tabsLabel">
            <button
                class="tab active"
                id="tab-btn-whitelist"
                type="button"
                role="tab"
                aria-controls="tab-whitelist"
                aria-selected="true"
                tabindex="0"
                data-tab="whitelist"
                data-i18n="tabWhitelist"
            ></button>
            <button
                class="tab"
                id="tab-btn-rules"
                type="button"
                role="tab"
                aria-controls="tab-rules"
                aria-selected="false"
                tabindex="-1"
                data-tab="rules"
                data-i18n="tabRules"
            ></button>
            <button
                class="tab"
                id="tab-btn-order"
                type="button"
                role="tab"
                aria-controls="tab-order"
                aria-selected="false"
                tabindex="-1"
                data-tab="order"
                data-i18n="tabOrder"
            ></button>
            <button
                class="tab"
                id="tab-btn-about"
                type="button"
                role="tab"
                aria-controls="tab-about"
                aria-selected="false"
                tabindex="-1"
                data-tab="about"
                data-i18n="tabAbout"
            ></button>
        </nav>

        <main>
            <section class="tab-content active" id="tab-whitelist" role="tabpanel" aria-labelledby="tab-btn-whitelist">
                <p class="section-desc" data-i18n="whitelistDesc"></p>
                <div class="input-row">
                    <input
                        type="text"
                        id="whitelist-input"
                        autocomplete="off"
                        spellcheck="false"
                        data-i18n-placeholder="whitelistPlaceholder"
                        data-i18n-aria-label="whitelistInputLabel"
                    />
                    <button class="btn btn-primary" id="whitelist-add" type="button" data-i18n="btnAdd"></button>
                </div>
                <ul class="item-list" id="whitelist-list">
                    <li class="empty-state" data-i18n="whitelistEmpty"></li>
                </ul>
            </section>

            <section class="tab-content" id="tab-rules" role="tabpanel" aria-labelledby="tab-btn-rules">
                <p class="section-desc" data-i18n="rulesDesc"></p>
                <ul class="item-list" id="rules-list">
                    <li class="empty-state" data-i18n="rulesEmpty"></li>
                </ul>
            </section>

            <section class="tab-content" id="tab-order" role="tabpanel" aria-labelledby="tab-btn-order">
                <p class="section-desc" data-i18n="orderDesc"></p>
                <ul class="item-list order-list" id="order-list">
                    <li class="empty-state" data-i18n="orderEmpty"></li>
                </ul>
            </section>

            <section class="tab-content" id="tab-about" role="tabpanel" aria-labelledby="tab-btn-about">
                <div class="about-block">
                    <h2 class="about-title" data-i18n="extName"></h2>
                    <p class="about-version" data-i18n="aboutVersion"></p>
                    <p class="about-desc" data-i18n="aboutDesc"></p>
                    <div class="about-features">
                        <div class="feature" data-i18n="feature1"></div>
                        <div class="feature" data-i18n="feature2"></div>
                        <div class="feature" data-i18n="feature3"></div>
                        <div class="feature" data-i18n="feature4"></div>
                    </div>
                </div>
            </section>
        </main>

        <script src="../i18n.js"></script>
        <script src="../order.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
